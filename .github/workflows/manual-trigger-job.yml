name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install az ml extension
        run: az extension add --name ml --yes

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Machine Learning training job
        run: az ml job create --file src/job.yml --stream --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --workspace-name "${{ vars.AZURE_WORKSPACE_NAME }}"
